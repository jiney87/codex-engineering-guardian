name: Engineering Guardian CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skill manifest
        run: python3 skills/engineering-guardian/scripts/validate_skill.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Audit source (heuristic, not security proof)
        run: python3 skills/engineering-guardian/scripts/check_repo.py --root . --format text
      - name: Check standards registry
        run: python3 tools/refresh_sources.py --check
